<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #18181b;
        --fg: #e4e4e7;
        --dim: #71717a;
        --line: #3f3f46;
        --panel: #27272a;
        --accent: #86efac;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --fg: #18181b;
          --dim: #71717a;
          --line: #d4d4d8;
          --panel: #f4f4f5;
          --accent: #15803d;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 44px;
        padding: 40px 24px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      form { width: min(560px, 100%); }

      input {
        width: 100%;
        padding: 14px 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        color: var(--fg);
        font: inherit;
        outline: none;
      }
      input:focus { border-color: var(--accent); }
      input::placeholder { color: var(--dim); }

      .sites {
        width: min(560px, 100%);
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 6px;
      }

      .sites a {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 11px;
        border-radius: 8px;
        color: var(--fg);
        text-decoration: none;
        overflow: hidden;
      }
      .sites a:hover { background: var(--panel); }
      .sites img { width: 16px; height: 16px; flex: none; border-radius: 3px; }
      .sites span {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      footer { color: var(--dim); font-size: 12px; }
      footer b { color: var(--accent); font-weight: 400; }
    </style>
  </head>
  <body>
    <form action="https://www.google.com/search" method="get">
      <input
        id="q"
        name="q"
        type="text"
        placeholder="Search Google"
        autocomplete="off"
        spellcheck="false"
      />
    </form>

    <nav class="sites" id="sites"></nav>

    <footer><b>Ctrl-A</b> then <b>?</b> for the keys</footer>

    <script src="content/ui.js"></script>
    <script src="content/main.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
